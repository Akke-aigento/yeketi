name: RLS Isolation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start dev server
        run: |
          nohup bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "dev server up"; exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start"; tail -200 /tmp/dev.log; exit 1

      - name: Run RLS isolation test
        run: python tests/rls/test_rls_isolation.py

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then kill "$(cat /tmp/dev.pid)" || true; fi

      - name: Upload dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: /tmp/dev.log